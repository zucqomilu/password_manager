[project]
name = "password_manager"
version = "0.1.0"
description = "Command-line password manager with an encrypted vault"
requires-python = ">=3.12"
dependencies = [
    "cryptography==46.0.3",
    "pyperclip==1.11.0",
    "keyring==25.7.0",
    "argcomplete==3.7.2",
]

[project.scripts]
pm = "password_manager.cli:main"

[project.optional-dependencies]
# The Postgres storage backend (PM_STORAGE=postgres); without it pm runs on the JSON files only
postgres = [
    "psycopg[binary]==3.3.6",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "psycopg[binary]==3.3.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast isolated unit tests",
    "integration: tests touching real/realistic dependencies for one feature",
    "e2e: tests exercising multiple connected features together",
]
# Fail if a test uses an unregistered marker (catches typos in @pytest.mark.*)
addopts = "--strict-markers"

[tool.coverage.run]
source = ["src"]
# Measures the session agent daemon too. It runs with cwd="/", so omit patterns must not be relative.
patch = ["subprocess"]
omit = [
    "*/__init__.py",
    "*/password_manager/logger.py",
]
